services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ruta
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    environment:
      RUTA_DATABASE_URL: postgresql+psycopg://ruta_app:ruta_app@db:5432/ruta
      RUTA_ADMIN_DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/ruta
      RUTA_CORS_ORIGINS: http://localhost:8080
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    ports: ["8080:80"]
    depends_on:
      - backend

volumes:
  db_data:
